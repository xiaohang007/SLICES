# The bundled GFN-FF library (src/slices/_vendor) is a Linux x86_64 binary, so the wheel is
# tagged for that platform; pip on other platforms then falls back to an older release instead
# of installing a wheel that fails at decode time. All other metadata is in pyproject.toml.
[bdist_wheel]
plat_name = manylinux2014_x86_64
